# Cinco motores de datos de COOTEP Turno.
# Arranque (después de crear la red): docker compose -f infra/compose.datos.yml up -d --wait
# Los puertos no se publican: las aplicaciones llegan por la red externa cootep-net.
# Para depurar desde el equipo, descomente el bloque "ports" del motor que necesite.

name: cootep-datos

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: cootep
      POSTGRES_USER: cootep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en infra/.env}
      TZ: UTC
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cootep -d cootep"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["127.0.0.1:5433:5432"]
    networks: [cootep-net]
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD en infra/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ports: ["127.0.0.1:6379:6379"]
    networks: [cootep-net]
    restart: unless-stopped

  mongo:
    image: mongo:8.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD en infra/.env}
      MONGO_INITDB_DATABASE: cootep
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Defina MONGO_APP_PASSWORD en infra/.env}
    volumes:
      - mongo_datos:/data/db
      - ./init/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports: ["127.0.0.1:27018:27017"]
    networks: [cootep-net]
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0.2
    # El script arranca Cassandra y aplica el esquema de auditoría cuando acepta conexiones.
    entrypoint: ["bash", "/init/iniciar.sh"]
    environment:
      CASSANDRA_CLUSTER_NAME: cootep
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_datos:/var/lib/cassandra
      - ./init/cassandra:/init:ro
    healthcheck:
      # Solo pasa cuando el keyspace ya existe, así --wait espera también al esquema.
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACE cootep' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [cootep-net]
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: cootep
      CLICKHOUSE_USER: cootep
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Defina CLICKHOUSE_PASSWORD en infra/.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_datos:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # ports: ["127.0.0.1:8123:8123"]
    networks: [cootep-net]
    restart: unless-stopped

volumes:
  pg_datos:
  redis_datos:
  mongo_datos:
  cassandra_datos:
  clickhouse_datos:

networks:
  cootep-net:
    external: true
