# Tres backends y la web de COOTEP Turno.
# Requiere la red externa y los motores ya levantados:
#   docker compose -f infra/compose.apps.yml up -d --build --wait
# Se publican el backend principal (3000, para la APK), la web (8080) y el buzón de correo de pruebas (8025).

name: cootep-apps

services:
  backend-principal:
    build:
      context: ${RUTA_BACKEND_PRINCIPAL:-../apps/backend-principal}
    image: cootep/backend-principal:1.0.0
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://cootep:${POSTGRES_PASSWORD}@postgres:5432/cootep
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MONGO_URL: mongodb://cootep_app:${MONGO_APP_PASSWORD}@mongo:27017/cootep?authSource=cootep
      MONGO_DB: cootep
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_DATACENTER: datacenter1
      MOTOR_FILAS_URL: http://motor-filas:8080
      ANALITICA_URL: http://analitica:8000
      DEMANDA_DEMO: ${DEMANDA_DEMO:-false}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Defina SERVICE_TOKEN en infra/.env}
      JWT_SECRETO: ${JWT_SECRETO:?Defina JWT_SECRETO en infra/.env}
      CLAVE_CIFRADO_MFA: ${CLAVE_CIFRADO_MFA:?Defina CLAVE_CIFRADO_MFA en infra/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Dirección pública de la web: arma el retorno de Google y los enlaces de los correos.
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8080}
      # La cookie de sesión exige HTTPS salvo en localhost; false solo para probar por IP de la red.
      COOKIE_SEGURA: ${COOKIE_SEGURA:-true}
      SMTP_HOST: ${SMTP_HOST:-correo}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_SEGURO: ${SMTP_SEGURO:-false}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-COOTEP Turno <no-responder@cootep-turno.test>}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD_TEMPORAL: ${SUPERADMIN_PASSWORD_TEMPORAL:-}
    ports:
      - "${PUERTO_BACKEND:-3000}:3000"
    depends_on:
      correo:
        condition: service_started
      motor-filas:
        condition: service_healthy
      analitica:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y no localhost: en Alpine localhost resuelve primero a IPv6 (::1).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/salud"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [cootep-net]
    restart: unless-stopped

  motor-filas:
    build:
      context: ${RUTA_MOTOR_FILAS:-../apps/motor-filas}
    image: cootep/motor-filas:1.0.0
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [cootep-net]
    restart: unless-stopped

  analitica:
    build:
      context: ${RUTA_ANALITICA:-../apps/analitica}
    image: cootep/analitica:1.0.0
    environment:
      MONGO_URL: mongodb://cootep_app:${MONGO_APP_PASSWORD}@mongo:27017/cootep?authSource=cootep
      MONGO_DB: cootep
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: cootep
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      DEMANDA_DEMO: ${DEMANDA_DEMO:-false}
      PROCESOS_ESTADISTICAS: "4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [cootep-net]
    restart: unless-stopped

  web:
    build:
      context: ${RUTA_WEB:-../apps/web}
    image: cootep/web:1.0.0
    ports:
      - "${PUERTO_WEB:-8080}:8080"
    depends_on:
      backend-principal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [cootep-net]
    restart: unless-stopped

  # Buzón de pruebas: recibe los correos de recuperación y activación sin enviarlos a internet.
  # Bandeja en http://localhost:8025. Para correo real, cambie SMTP_* en infra/.env.
  correo:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    networks: [cootep-net]
    restart: unless-stopped

networks:
  cootep-net:
    external: true
